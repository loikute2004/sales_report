[project]
name = "sales-report"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "loikute2004", email = "nguyenhuuloiqt1510@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sales-report = "sales_report:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
